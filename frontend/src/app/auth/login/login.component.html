<div class="login-container">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-card">
    <div class="card-glow"></div>

    <div class="login-header">
      <div class="login-icon">
        <img *ngIf="logoUrl" [src]="logoUrl" alt="Logo" class="logo-img">
        <span *ngIf="!logoUrl" class="logo-emoji">💰</span>
      </div>
    </div>

    <div class="divider"></div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>
          <span class="label-icon">✉️</span> Email
        </label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="tu@email.com"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >
        <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Ingresa un email válido
        </small>
      </div>

      <div class="form-group">
        <label>
          <span class="label-icon">🔒</span> Contraseña
        </label>
        <div class="password-input">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
          >
          <button type="button" class="toggle-pass" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mínimo 6 caracteres
        </small>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe">
          <span class="checkmark"></span>
          Recordarme
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading" class="btn-content">
          <span>Iniciar Sesión</span>
          <span class="btn-arrow">→</span>
        </span>
        <span *ngIf="isLoading" class="btn-content">
          <span class="spinner"></span>
          <span>Verificando...</span>
        </span>
      </button>

      <div *ngIf="errorMessage" class="error-message">
        <span class="error-icon">⚠️</span> {{ errorMessage }}
      </div>
    </form>

    <div class="card-footer">
      <div class="footer-line"></div>
      <p>Sistema de control financiero personal</p>
    </div>
  </div>
</div>
